name: Release

# Build & package the sync server (linux) and the SSH client for the three
# desktop platforms, then attach everything to a GitHub Release. Triggered by
# pushing a tag like `v0.1.0`.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------- server (linux x86_64) ----------------
  build-server:
    name: Server (linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: rel-server-linux
      - name: Build server (release)
        run: cargo build --release -p server
      - name: Package
        run: |
          mkdir -p stage
          cp target/release/ssh-sync-server stage/
          cp README.md stage/ 2>/dev/null || true
          tar -C stage -czf ssh-sync-server-x86_64-unknown-linux-gnu.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: ssh-sync-server-x86_64-linux
          path: ssh-sync-server-x86_64-unknown-linux-gnu.tar.gz
          if-no-files-found: error

  # ---------------- client (linux x86_64) ----------------
  build-client-linux:
    name: Client (linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux GUI deps (Slint winit/skia)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libx11-dev libx11-xcb-dev libxrandr-dev libxi-dev \
            libxext-dev libxcursor-dev libgl1-mesa-dev libegl1-mesa-dev \
            libfontconfig1-dev libfreetype6-dev libwayland-dev libdbus-1-dev \
            libexpat1-dev
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: rel-client-linux
      - name: Build client (release)
        run: cargo build --release -p client
      - name: Package
        run: |
          mkdir -p stage
          cp target/release/ssh-client stage/
          tar -C stage -czf ssh-client-x86_64-unknown-linux-gnu.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: ssh-client-x86_64-linux
          path: ssh-client-x86_64-unknown-linux-gnu.tar.gz
          if-no-files-found: error

  # ---------------- client (macOS) ----------------
  # Builds aarch64 natively (required) and attempts an x86_64 cross-compile.
  # If the cross-compile fails (skia C++ cross-build can be flaky) we fall back
  # to an aarch64-only build so the release never breaks on macOS.
  build-client-macos:
    name: Client (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: rel-client-macos
      - name: Build client (aarch64)
        run: cargo build --release -p client --target aarch64-apple-darwin
      - name: Build client (x86_64, cross-compile)
        id: intel
        continue-on-error: true
        run: cargo build --release -p client --target x86_64-apple-darwin
      - name: Create universal binary (or fall back to aarch64)
        id: macbin
        run: |
          mkdir -p stage
          if [ -f target/x86_64-apple-darwin/release/ssh-client ]; then
            lipo -create \
              target/aarch64-apple-darwin/release/ssh-client \
              target/x86_64-apple-darwin/release/ssh-client \
              -output stage/ssh-client
            echo "name=ssh-client-universal-apple-darwin" >> "$GITHUB_OUTPUT"
          else
            cp target/aarch64-apple-darwin/release/ssh-client stage/ssh-client
            echo "name=ssh-client-aarch64-apple-darwin" >> "$GITHUB_OUTPUT"
            echo "::warning::x86_64 cross-compile unavailable; shipping aarch64-only build"
          fi
          file stage/ssh-client
      - name: Package (.app bundle - launches as a GUI app, no Terminal)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          case "$VERSION" in *[0-9].[0-9]*) ;; *) VERSION="0.1.1" ;; esac
          APP="SSH Client.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp stage/ssh-client "$APP/Contents/MacOS/ssh-client"
          chmod +x "$APP/Contents/MacOS/ssh-client"
          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0"><dict>' \
            '<key>CFBundleName</key><string>SSH Client</string>' \
            '<key>CFBundleDisplayName</key><string>SSH Client</string>' \
            '<key>CFBundleIdentifier</key><string>app.zhiyong.ssh-client</string>' \
            '<key>CFBundleVersion</key><string>1</string>' \
            "<key>CFBundleShortVersionString</key><string>${VERSION}</string>" \
            '<key>CFBundlePackageType</key><string>APPL</string>' \
            '<key>CFBundleExecutable</key><string>ssh-client</string>' \
            '<key>CFBundleInfoDictionaryVersion</key><string>6.0</string>' \
            '<key>LSMinimumSystemVersion</key><string>11.0</string>' \
            '<key>NSHighResolutionCapable</key><true/>' \
            '<key>NSSupportsAutomaticGraphicsSwitching</key><true/>' \
            '</dict></plist>' > "$APP/Contents/Info.plist"
          tar czf ${{ steps.macbin.outputs.name }}.tar.gz "$APP"
      - uses: actions/upload-artifact@v4
        with:
          name: ssh-client-macos
          path: ${{ steps.macbin.outputs.name }}.tar.gz
          if-no-files-found: error

  # ---------------- client (windows x86_64) ----------------
  build-client-windows:
    name: Client (windows x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: rel-client-windows
      - name: Build client (release)
        run: cargo build --release -p client
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          Copy-Item target/release/ssh-client.exe stage/
          Compress-Archive -Path stage/* -DestinationPath ssh-client-x86_64-pc-windows-msvc.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ssh-client-x86_64-windows
          path: ssh-client-x86_64-pc-windows-msvc.zip
          if-no-files-found: error

  # ---------------- publish GitHub Release ----------------
  release:
    name: Publish release
    needs:
      - build-server
      - build-client-linux
      - build-client-macos
      - build-client-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect release assets
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} release-assets/ \;
          ls -l release-assets
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
